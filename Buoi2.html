<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* HEADER */
        header {
            width: 82%;
            margin: auto;
            background: #e5a0a2;
            display: flex;
            align-items: center;
            height: 35px;
        }

        /* MENU */
        header nav {
            display: flex;
            align-items: center;
            height: 35px;
            flex-shrink: 0;
        }

        /* CÁC LIÊN KẾT MENU */
        header nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            padding: 10px 15px;
            border-right: 1px solid white;
            white-space: nowrap;
        }

        /* HIỆU ỨNG MENU */
        header nav a:hover {
            background: #cc8588;
        }

        /* FORM TÌM KIẾM */
        header form {
            display: flex;
            width: 30%;
            height: 35px;
            align-items: center;
            justify-content: flex-end;
            gap: 7px;
            padding: 3px 20px;
            margin-left: auto;
            box-sizing: border-box;
        }

        /* Ô Nhập Tìm Kiếm */
        header form input {
            flex: 1;
            min-width: 0;
            height: 27px;
            padding: 5px 10px;
            border: 1px solid #999;
            border-radius: 5px;
            background: white;
            outline: none;
        }

        /* NÚT TÌM KIẾM */
        header form button {
            flex-shrink: 0;
            width: 75px;
            height: 27px;
            white-space: nowrap;
            border: 1px solid #999;
            border-radius: 5px;
            cursor: pointer;
        }

        /* PHẦN SẢN PHẨM */
        .products {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        /* Tiêu đề */
        .products h2 {
            grid-column: 1 / -1;
            font-size: 25px;
            font-weight: normal;
            margin-bottom: 5px;
        }

        /* Card sản phẩm */
        .products article {
            height: 252px;
            background: white;
            border: 1px solid #bbb;
            padding: 15px;
            text-align: center;
        }

        /* Ảnh sản phẩm */
        .products article img {
            width: 100%;
            height: 160px;
            object-fit: contain;
        }

        /* Tên sản phẩm */
        .products article h3 {
            font-size: 15px;
            font-weight: normal;
            margin: 8px 0;
        }

        /* Giá bán */
        .products article p {
            display: inline;
            color: #8b2525;
            font-size: 16px;
            font-weight: bold;
        }

        /* Giá cũ */
        .products article del {
            color: #555;
            font-size: 12px;
            margin-left: 5px;
        }

        /* FOOTER */
        footer {
            width: 82%;
            margin: 165px auto 0;
            padding: 15px;
            background: #e5a0a2;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>

        <nav>
            <a href="#">Trang chủ</a>
            <a href="#">Bánh ngọt</a>
            <a href="#">Bánh kem</a>
            <a href="#">Bánh bao</a>
            <a href="#">Liên hệ</a>
        </nav>

        <form action="#" method="get">
            <input type="text" name="search" placeholder="Tìm kiếm...">
            <button type="submit">Tìm kiếm</button>
        </form>
    </header>
    <h1> Water Love</h1>

    <main>

        <!-- Banner quảng cáo -->
        <section class="banner">
            <img src="image/banner.jpg" alt="Banner quảng cáo">
        </section>

        <!-- Danh sách sản phẩm -->
        <section class="products">

            <h2>Ưu Đãi Dành Riêng cho Bạn</h2>

            <article>
                <img src="image/anh_1.png" alt="Freeze Trà Xanh">
                <h3>Freeze Trà Xanh</h3>
                <p>25.000đ</p>
                <del>35.000đ</del>
            </article>

            <article>
                <img src="image/anh_2.png" alt="Cà phê phin Highlands">
                <h3>Cà phê phin Highlands</h3>
                <p>29.000đ</p>
                <del>37.000đ</del>
            </article>

            <article>
                <img src="image/anh_3.png" alt="Trà Thạch Vải">
                <h3>Trà Thạch Vải</h3>
                <p>25.000đ</p>
                <del>35.000đ</del>
            </article>

            <article>
                <img src="image/anh_4.png" alt="Trà Thạch Đào">
                <h3>Trà Thạch Đào</h3>
                <p>25.000đ</p>
                <del>35.000đ</del>
            </article>

        </section>

    </main>

    <footer>
        <p>Copyright © 2024 Design by Ochna</p>
    </footer>

</body>

</html>
